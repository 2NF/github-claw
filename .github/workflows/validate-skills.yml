name: Validate agent skills

on:
  pull_request:
    paths: [".agents/**", "AGENTS.md"]
  push:
    branches: [main]
    paths: [".agents/**", "AGENTS.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skills
        run: python3 .agents/validate-skills.py
